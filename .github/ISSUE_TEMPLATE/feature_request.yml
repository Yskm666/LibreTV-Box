name: 功能建议
description: 新功能、新线路、新规则源或体验改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！请说明动机与方案，方便评估可行性。
  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 痛点
      description: 这个功能解决什么问题？使用场景是什么？
      placeholder: 例如：希望支持 XX 协议线路，因为……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你希望如何实现（可给出参考项目或链接）
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 其他可行的做法（可选）
  - type: checkboxes
    id: scope
    attributes:
      label: 适用范围
      description: 该功能是否影响核心链路（广告拦截 / 播放 / 解析）
      options:
        - label: 影响广告拦截链路
        - label: 影响播放 / 解析链路
        - label: 仅界面或体验层
